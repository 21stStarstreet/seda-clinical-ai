[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "dermatology-cdss"
version = "1.0.0"
description = "Psoriazis Hasta Yönlendirme Klinik Karar Destek Sistemi"
requires-python = ">=3.10"
dependencies = [
    # Core ML
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "lightgbm>=4.3",
    "optuna>=3.5",
    "imbalanced-learn>=0.12",
    "iterstrat>=0.1.7",
    # Explainability
    "shap>=0.45",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    # Data validation
    "pydantic>=2.5",
    "pydantic-settings>=2.2",
    # API
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    # LLM
    "google-generativeai>=0.5",
    # Storage
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    # Utils
    "joblib>=1.3",
    "loguru>=0.7",
    "python-dotenv>=1.0",
    "rich>=13.7",             # Güzel terminal çıktısı
    "typer>=0.12",            # CLI için
    # Security (Faz 4)
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "bcrypt==4.0.1",
    "cryptography>=42.0",
    "slowapi>=0.1",
    "python-multipart>=0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",            # FastAPI test client
    "ipykernel>=6.29",        # Notebook desteği
    "jupyter>=1.0",
    "black>=24.0",
    "ruff>=0.3",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
